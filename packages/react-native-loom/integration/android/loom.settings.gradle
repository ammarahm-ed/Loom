// Loom Android integration. Apply from the app's settings.gradle(.kts):
//
//   settings.gradle:      apply from: file("../node_modules/react-native-loom/integration/android/loom.settings.gradle")
//   settings.gradle.kts:  apply(from = file("../node_modules/react-native-loom/integration/android/loom.settings.gradle"))
//
// Placement matters on Gradle 9: no statement other than buildscript {},
// pluginManagement {} and plugins {} may appear before the `plugins {}` block,
// so apply it immediately after that block - and before
// `autolinkLibrariesFromCommand()`, which resolves react-native.config.js's
// reactNativePath and therefore needs the materialized tree to already exist:
//
//   pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
//   plugins { id("com.facebook.react.settings") }
//   apply from: file("../node_modules/react-native-loom/integration/android/loom.settings.gradle")
//   extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
//
// What it does:
//  1. runs `loom materialize` (a no-op when the stamp is current), producing
//     <app>/node_modules/.loom/react-native = react-native + Loom overrides
//  2. includes that tree as a composite build and substitutes the prebuilt
//     com.facebook.react:react-android / hermes-android artifacts with it
//
// Set LOOM_SKIP_MATERIALIZE=1 to skip step 1 (the tree must already exist), and
// the `loomAppRoot` Gradle property to override <app> (= settings.rootDir/..).
//
// Pair it with `react { reactNativeDir = file("../node_modules/.loom/react-native") }`
// in app/build.gradle so the RN Gradle plugin's codegen uses the same tree.

def loomAppRoot = settings.hasProperty("loomAppRoot")
    ? new File(settings.loomAppRoot)
    : settings.rootDir.parentFile

// This file normally lives at <app>/node_modules/react-native-loom/integration/android/,
// so bin/loom.js is three levels up. Fall back to a node_modules lookup for a
// vendored/relocated copy, and fail loudly rather than run the wrong binary.
def loomBinSource = buildscript.sourceFile
def loomBin = new File(loomBinSource != null ? loomBinSource.parentFile : loomAppRoot,
    loomBinSource != null ? "../../bin/loom.js" : "node_modules/react-native-loom/bin/loom.js")
    .canonicalFile
if (!loomBin.exists()) {
  loomBin = new File(loomAppRoot, "node_modules/react-native-loom/bin/loom.js").canonicalFile
}
if (!loomBin.exists()) {
  throw new GradleException(
      "Loom: cannot find bin/loom.js (looked next to ${loomBinSource} and in " +
          "${loomAppRoot}/node_modules/react-native-loom). Reinstall react-native-loom.")
}

def loomSkip = System.getenv("LOOM_SKIP_MATERIALIZE") == "1"

if (!loomSkip) {
  def proc = ["node", loomBin.absolutePath, "materialize"].execute(null, loomAppRoot)
  def out = new StringBuilder(), err = new StringBuilder()
  proc.waitForProcessOutput(out, err)
  if (proc.exitValue() != 0) {
    throw new GradleException("loom materialize failed:\n${out}${err}")
  }
  logger.lifecycle(out.toString().trim())
}

def loomReactNativeDir = new File(loomAppRoot, "node_modules/.loom/react-native")
if (!new File(loomReactNativeDir, ".loom-stamp.json").exists()) {
  throw new GradleException("Loom: ${loomReactNativeDir} is missing. Run `npx loom materialize` in ${loomAppRoot}.")
}
gradle.ext.loomReactNativeDir = loomReactNativeDir

// Native libraries (Reanimated, Worklets, gesture-handler, screens, svg, ...) compile against
// React Native's C++ headers, and find them through this conventional root-project property, or
// failing that through Node resolution, which lands on the stock package. Point them at the Loom
// tree so their native code is built against the headers React Native itself is built from.
// Libraries read it from the root project or from the app project, so every project carries it.
gradle.beforeProject { p ->
  if (!p.ext.has("REACT_NATIVE_NODE_MODULES_DIR")) {
    p.ext.REACT_NATIVE_NODE_MODULES_DIR = loomReactNativeDir.absolutePath
  }
}

includeBuild(loomReactNativeDir) {
  dependencySubstitution {
    substitute(module("com.facebook.react:react-android")).using(project(":packages:react-native:ReactAndroid"))
    substitute(module("com.facebook.react:react-native")).using(project(":packages:react-native:ReactAndroid"))
    substitute(module("com.facebook.react:hermes-android")).using(project(":packages:react-native:ReactAndroid:hermes-engine"))
    substitute(module("com.facebook.react:hermes-engine")).using(project(":packages:react-native:ReactAndroid:hermes-engine"))
  }
}

// Native libraries that link Hermes (react-native-worklets, Reanimated, ...) read its Prefab
// package when their CMake build is configured. Gradle does not carry that dependency across the
// composite-build boundary, so without this a clean build configures them against the
// headers-only Hermes package and fails to link libhermesvm. Make each CMake configure task wait
// for the matching Hermes Prefab configuration.
gradle.allprojects { p ->
  p.tasks.configureEach { t ->
    if (t.name.startsWith("configureCMake")) {
      def variant = t.name.contains("Debug") && !t.name.contains("RelWithDebInfo") ? "Debug" : "Release"
      t.dependsOn(gradle.includedBuild(loomReactNativeDir.name)
          .task(":packages:react-native:ReactAndroid:hermes-engine:prefab${variant}ConfigurePackage"))
    }
  }
}

// Reanimated animates through React Native's shared animation backend, which Loom implements
// on its own renderer (no shadow tree). Reanimated compiles that choice in from static feature
// flags, so switch them for its native build: USE_ANIMATION_BACKEND on, and
// FORCE_REACT_RENDER_FOR_SETTLED_ANIMATIONS (which cannot be combined with it) off.
def loomReanimatedFlags = { String flags ->
  if (!flags.contains("USE_ANIMATION_BACKEND")) {
    return flags // A Reanimated without the backend: nothing to switch.
  }
  return flags
      .replaceAll(/\[USE_ANIMATION_BACKEND:[a-z]+\]/, "[USE_ANIMATION_BACKEND:true]")
      .replaceAll(/\[FORCE_REACT_RENDER_FOR_SETTLED_ANIMATIONS:[a-z]+\]/,
          "[FORCE_REACT_RENDER_FOR_SETTLED_ANIMATIONS:false]")
}
gradle.beforeProject { p ->
  if (p.name != "react-native-reanimated") {
    return
  }
  p.plugins.withId("com.android.library") {
    p.extensions.getByName("androidComponents").finalizeDsl { android ->
      def args = android.defaultConfig.externalNativeBuild.cmake.arguments
      for (int i = 0; i < args.size(); i++) {
        def prefix = "-DREANIMATED_FEATURE_FLAGS="
        if (args[i].startsWith(prefix)) {
          args[i] = prefix + loomReanimatedFlags(args[i].substring(prefix.length()))
        }
      }
      // Reanimated adapter (adapters/reanimated): for a supported Reanimated, its CMake build puts
      // the adapter's ReanimatedModuleProxy.cpp in place of the original (README there).
      def adapterDir = new File(loomBin.parentFile.parentFile, "adapters/reanimated")
      def reanimatedVersion = new groovy.json.JsonSlurper()
          .parse(new File(p.projectDir.parentFile, "package.json")).version
      def supported = new groovy.json.JsonSlurper()
          .parse(new File(adapterDir, "supported.json")).versions
      if (supported.contains(reanimatedVersion)) {
        args.add("-DCMAKE_PROJECT_Reanimated_INCLUDE=" +
            new File(adapterDir, "android/loom-reanimated.cmake").absolutePath)
        args.add("-DLOOM_REANIMATED_ADAPTER_DIR=" + adapterDir.absolutePath)
        args.add("-DLOOM_REANIMATED_VERSION=" + reanimatedVersion)
      } else {
        logger.warn("Loom: react-native-reanimated ${reanimatedVersion} has no Loom adapter " +
            "(supported: ${supported}); layout animations will mount without animating.")
      }
    }
  }
}
