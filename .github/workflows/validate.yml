name: validate

# The cheapest, most valuable check: the overrides are internally consistent with
# the installed react-native, `src/` has no unregistered files, and the JS
# overrides are what the test app's Jest run resolves.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overrides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installs the pristine react-native@<overrides target> that `loom validate`
      # hashes against (it is a devDependency of packages/react-native-loom).
      - name: Install workspace
        run: yarn install --frozen-lockfile

      - name: Validate overrides
        run: node packages/react-native-loom/bin/loom.js validate

      - name: Report what we carry
        run: |
          {
            echo '## Overrides by area'
            echo
            echo '```'
            node packages/react-native-loom/bin/loom.js status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  app-jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        working-directory: apps/loom-test-app
        run: npm install --no-audit --no-fund

      - name: Materialize
        working-directory: apps/loom-test-app
        run: node node_modules/react-native-loom/bin/loom.js materialize

      # jest.config.js maps `react-native` to the materialized tree, so this fails if
      # the JS overrides (e.g. Libraries/LayoutAnimation/LayoutAnimation.js) are not
      # what the app resolves.
      - name: Jest
        working-directory: apps/loom-test-app
        run: npm test -- --ci