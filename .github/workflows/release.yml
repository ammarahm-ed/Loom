# Release Loom: build every prebuilt variant, then publish them.
#
#   - Maven Central: io.github.ammarahm-ed:{react-android, react-android-profiling,
#     react-native-artifacts}, one Central Portal deployment per artifact.
#   - GitHub release v<version>: every AAR, symbols zip and iOS tarball, plus SHASUMS256.txt.
#   - npm: react-native-loom, as a STAGED publish (approve it on npmjs.com with 2FA).
#
# Manual only. The version is packages/react-native-loom/package.json's; bump it before running.
# dry_run builds and verifies everything, validates the Maven bundles on the Central Portal (then drops them),
# and runs `npm publish --dry-run`, without publishing anything.
#
# Order: Maven Central (every bundle validated before any is published), then npm (it resolves its
# prebuilt binaries from Maven Central), then the GitHub release and tag last, so a failure never leaves a
# tag for a version that is not fully out.
#
# A run that failed part-way is resumed with `resume: true`: artifacts already on Maven Central are skipped
# (Central is immutable), and only what is missing is published.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify everything without publishing
        type: boolean
        default: true
      npm_tag:
        description: npm dist-tag (empty = "next" for prereleases, "latest" otherwise)
        type: string
        default: ''
      resume:
        description: Continue a release that failed part-way (skip what is already published)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  XCODE_VERSION: '16.4'

jobs:
  meta:
    name: Version and checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      rn_version: ${{ steps.v.outputs.rn_version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: v
        name: Read versions
        env:
          # Inputs reach scripts only through the environment, never pasted into the script text.
          NPM_TAG_INPUT: ${{ inputs.npm_tag }}
        run: |
          VERSION=$(node -p "require('./packages/react-native-loom/package.json').version")
          RN_VERSION=$(node -p "require('./packages/react-native-loom/overrides.json').upstream.version")
          PRERELEASE=false; case "$VERSION" in *-*) PRERELEASE=true ;; esac
          TAG="$NPM_TAG_INPUT"
          if [ -z "$TAG" ]; then if [ "$PRERELEASE" = true ]; then TAG=next; else TAG=latest; fi; fi
          if ! printf '%s' "$TAG" | grep -Eq '^[a-z][a-z0-9._-]{0,63}$'; then
            echo "::error::npm_tag must be a plain dist-tag name, got '$TAG'"; exit 1
          fi
          {
            echo "version=$VERSION"; echo "rn_version=$RN_VERSION"
            echo "prerelease=$PRERELEASE"; echo "npm_tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Loom $VERSION"
            echo "- React Native: $RN_VERSION"
            echo "- Prerelease: $PRERELEASE, npm tag: $TAG"
            echo "- Dry run: ${{ inputs.dry_run }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check Loom's version matches React Native's minor
        # Loom 0.<minor>.<patch> builds on React Native 0.<minor>.x. Loom can ship more patch releases than React
        # Native (0.89.1 ... 0.89.10 on any RN 0.89.x): only major.minor must match.
        env:
          VERSION: ${{ steps.v.outputs.version }}
          RN_VERSION: ${{ steps.v.outputs.rn_version }}
        run: |
          loom_minor=$(echo "$VERSION" | cut -d. -f1,2)
          rn_minor=$(echo "$RN_VERSION" | cut -d. -f1,2)
          if [ "$loom_minor" != "$rn_minor" ]; then
            echo "::error::Loom $VERSION must be $rn_minor.x to build on React Native $RN_VERSION"
            exit 1
          fi
      - name: Check every Loom source file is listed in overrides.json
        # Apps and the prebuilds copy only listed files, so an unlisted header builds here and breaks everywhere else.
        run: node packages/react-native-loom/bin/loom.js validate --listing
      - name: Check the version is not already released
        env:
          VERSION: ${{ steps.v.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESUME: ${{ inputs.resume }}
        run: |
          problems=()
          # npm is published before the tag, so npm having the version means the release went through.
          npm view "react-native-loom@$VERSION" version >/dev/null 2>&1 \
            && problems+=("react-native-loom@$VERSION is already on npm")
          if [ "$RESUME" != true ]; then
            git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1 \
              && problems+=("git tag v$VERSION already exists")
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://repo1.maven.org/maven2/io/github/ammarahm-ed/react-android/$VERSION/react-android-$VERSION.pom")
            [ "$code" = 200 ] && problems+=("io.github.ammarahm-ed:react-android:$VERSION is already on Maven Central (use resume: true to finish a partial release)")
          fi
          for p in "${problems[@]}"; do
            if [ "$DRY_RUN" = true ]; then echo "::warning::$p"; else echo "::error::$p"; fi
          done
          if [ "${#problems[@]}" -gt 0 ] && [ "$DRY_RUN" != true ]; then exit 1; fi

  android:
    name: Android${{ matrix.profiling == '1' && ' profiling' || '' }}
    needs: meta
    runs-on: ubuntu-latest
    # Under GitHub's 6 h job cap, so an overrun fails with a clear timeout instead of a cancellation.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        profiling: ['0', '1']
    env:
      LOOM_PROFILING: ${{ matrix.profiling }}
      LOOM_PUBLISH_VERSION: ${{ needs.meta.outputs.version }}
      LOOM_PREBUILD_DIR: /mnt/loom/work
      LOOM_BASELINE_DIR: /mnt/loom/baseline
      LOOM_MAVEN_LOCAL: /mnt/loom/maven
      CCACHE_DIR: /mnt/loom/ccache
      # Large while building: both passes of every variant must fit, or pass 1's objects are evicted before
      # pass 2 can reuse them. Trimmed to CCACHE_SAVE_SIZE before the cache is uploaded.
      CCACHE_MAXSIZE: 30G
      CCACHE_SAVE_SIZE: 1800M
      # 4 vCPU / 16 GB: a clang job per core next to the Gradle daemon is what gets OOM-killed. Two
      # workers and two compile jobs keep the peak well under the limit.
      GRADLE_OPTS: -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4g
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/android/sdk/ndk/* /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/loom && sudo chown "$USER" /mnt/loom
          df -h / /mnt
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - name: Install yarn and ccache
        run: |
          npm install -g yarn@1.22.22
          sudo apt-get install -y -qq ccache >/dev/null && ccache --version | head -1
      # Compiler cache. Only the
      # background job saves it, and each cache is capped, so the five flavors stay within GitHub's 10 GB.
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/loom/ccache
          key: ccache-android-${{ matrix.profiling }}-${{ github.run_id }}
          restore-keys: ccache-android-${{ matrix.profiling }}-
      - name: React Native baseline AARs
        env:
          RN_VERSION: ${{ needs.meta.outputs.rn_version }}
        run: |
          mkdir -p "$LOOM_BASELINE_DIR"
          for v in debug debugOptimized release; do
            curl -fsSL -o "$LOOM_BASELINE_DIR/react-android-$RN_VERSION-$v.aar" \
              "https://repo1.maven.org/maven2/com/facebook/react/react-android/$RN_VERSION/react-android-$RN_VERSION-$v.aar"
          done
      - name: Prepare the React Native build tree
        run: tools/prebuild/prepare.sh
      - name: Install the NDK and CMake React Native pins
        # One source of truth each: the NDK from React Native's libs.versions.toml (android.sh reads the
        # same file), CMake from ReactAndroid/build.gradle.kts (its CMAKE_VERSION default). The runner's
        # SDK carries neither version.
        run: |
          RN="$LOOM_PREBUILD_DIR/rn-src/packages/react-native"
          NDK=$(sed -n 's/^ndkVersion = "\(.*\)"/\1/p' "$RN/gradle/libs.versions.toml")
          CMAKE=$(sed -n 's/.*getenv("CMAKE_VERSION") ?: "\([0-9.]*\)".*/\1/p' "$RN/ReactAndroid/build.gradle.kts")
          [ -n "$NDK" ] || { echo "::error::no ndkVersion in libs.versions.toml"; exit 1; }
          [ -n "$CMAKE" ] || { echo "::error::no CMAKE_VERSION default in ReactAndroid/build.gradle.kts"; exit 1; }
          echo "NDK $NDK, CMake $CMAKE"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" "cmake;$CMAKE" >/dev/null
          df -h / /mnt
      - name: Build, publish locally and verify
        run: tools/prebuild/android.sh
      - name: Disk after build
        if: always()
        run: df -h / /mnt
      - name: Trim the compiler cache for upload
        if: always()
        run: |
          ccache --show-stats | grep -E "Hits|Cache size" || true
          ccache --max-size="$CCACHE_SAVE_SIZE" >/dev/null && ccache --cleanup >/dev/null
          ccache --show-stats | grep "Cache size" || true
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/loom/ccache
          key: ccache-android-${{ matrix.profiling }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: maven-android-${{ matrix.profiling }}-${{ needs.meta.outputs.version }}-${{ github.sha }}
          path: /mnt/loom/maven/io/github/ammarahm-ed/
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS ${{ matrix.flavor }}
    needs: meta
    runs-on: macos-15
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        flavor: [Debug, Release, ReleaseProfiling]
    env:
      LOOM_PREBUILD_DIR: ${{ github.workspace }}/../cs/work
      LOOM_IOS_OUT: ${{ github.workspace }}/../cs/ios-out
      LOOM_BASELINE_DIR: ${{ github.workspace }}/../baseline
      CCACHE_DIR: ${{ github.workspace }}/../ccache
      CCACHE_MAXSIZE: 30G
      CCACHE_SAVE_SIZE: 2G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app" && xcodebuild -version
      - name: Free disk space
        # The image ships several Xcodes (10-30 GB each), simulator runtimes and the Android SDK; the
        # SwiftPM builds below need that room.
        run: |
          df -h /
          for x in /Applications/Xcode_*.app; do
            [ "$x" = "/Applications/Xcode_${XCODE_VERSION}.app" ] || sudo rm -rf "$x"
          done
          sudo rm -rf ~/Library/Android "$ANDROID_HOME" /usr/local/share/android-sdk \
            ~/Library/Developer/CoreSimulator/Caches /Library/Developer/CoreSimulator/Volumes/* 2>/dev/null || true
          xcrun simctl delete all 2>/dev/null || true
          df -h /
      - name: Case-sensitive build volume
        # React Native's prefab and header trees have React/ and react/ side by side.
        run: |
          CS="$GITHUB_WORKSPACE/../cs"
          hdiutil create -size 60g -type SPARSE -fs "Case-sensitive APFS" -volname loomcs "$RUNNER_TEMP/loomcs.sparseimage"
          mkdir -p "$CS" && hdiutil attach "$RUNNER_TEMP/loomcs.sparseimage" -mountpoint "$CS" -nobrowse
      - name: Install yarn and ccache
        run: |
          npm install -g yarn@1.22.22
          brew install ccache >/dev/null && ccache --version | head -1
      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-ios-${{ matrix.flavor }}-${{ github.run_id }}
          restore-keys: ccache-ios-${{ matrix.flavor }}-
      - name: React Native baseline tarballs
        env:
          RN_VERSION: ${{ needs.meta.outputs.rn_version }}
        run: |
          mkdir -p "$LOOM_BASELINE_DIR"
          for c in debug release; do
            f="react-native-artifacts-$RN_VERSION-reactnative-core-$c.tar.gz"
            curl -fsSL -o "$LOOM_BASELINE_DIR/$f" \
              "https://repo1.maven.org/maven2/com/facebook/react/react-native-artifacts/$RN_VERSION/$f"
          done
      - name: Prepare the React Native build tree
        run: tools/prebuild/prepare.sh
      - name: Build and verify
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: tools/prebuild/ios.sh "$FLAVOR"
      - name: Disk after build
        if: always()
        run: df -h / "$GITHUB_WORKSPACE/../cs"
      - name: Trim the compiler cache for upload
        if: always()
        run: |
          ccache --show-stats | grep -E "Hits|Cache size" || true
          ccache --max-size="$CCACHE_SAVE_SIZE" >/dev/null && ccache --cleanup >/dev/null
          ccache --show-stats | grep "Cache size" || true
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.workspace }}/ccache
          key: ccache-ios-${{ matrix.flavor }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.flavor }}-${{ needs.meta.outputs.version }}-${{ github.sha }}
          path: ${{ runner.workspace }}/cs/ios-out/
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble, sign and checksum
    needs: [meta, android, ios]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      # /mnt has the room: the repository, its bundles and the release assets are each the full payload.
      REPO: /mnt/loom/repo
      OUT: /mnt/loom/out
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo mkdir -p /mnt/loom && sudo chown "$USER" /mnt/loom
          df -h / /mnt
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: maven-android-*-${{ needs.meta.outputs.version }}-${{ github.sha }}
          path: /mnt/loom/repo/io/github/ammarahm-ed
          merge-multiple: true
      - name: Android publishes only react-android*
        # RN's external-artifacts project would also publish react-native-artifacts from every Android
        # job; the iOS step below owns those coordinates.
        run: |
          if [ -d "$REPO/io/github/ammarahm-ed/react-native-artifacts" ]; then
            echo "::error::an Android job published react-native-artifacts"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: ios-*-${{ needs.meta.outputs.version }}-${{ github.sha }}
          path: /mnt/loom/ios-out
          merge-multiple: true
      - name: Add the iOS artifacts to the repository
        env:
          LOOM_PUBLISH_VERSION: ${{ needs.meta.outputs.version }}
          LOOM_IOS_OUT: /mnt/loom/ios-out
          LOOM_MAVEN_LOCAL: /mnt/loom/repo
        run: |
          tools/prebuild/ios-publish.sh
      - name: Check every expected artifact is present
        run: |
          base="$REPO/io/github/ammarahm-ed"
          missing=0
          for a in react-android react-android-profiling react-native-artifacts; do
            [ -f "$base/$a/$VERSION/$a-$VERSION.pom" ] || { echo "::error::missing $a $VERSION"; missing=1; }
          done
          for c in debug release release-profiling; do
            for k in "reactnative-core-$c" "reactnative-core-dSYM-$c" "reactnative-headers-$c"; do
              [ -f "$base/react-native-artifacts/$VERSION/react-native-artifacts-$VERSION-$k.tar.gz" ] \
                || { echo "::error::missing iOS $k"; missing=1; }
            done
          done
          exit $missing
      - name: Javadoc and sources jars for jar/aar publications
        # Central requires -javadoc.jar and -sources.jar next to jar/aar artifacts. React Native publishes
        # sources but no javadoc; an empty javadoc jar is what Central accepts for that.
        run: |
          cd "$REPO/io/github/ammarahm-ed"
          mkdir -p /tmp/empty-javadoc && echo "See https://github.com/ammarahm-ed/Loom" > /tmp/empty-javadoc/README
          for a in react-android react-android-profiling; do
            d="$a/$VERSION"
            [ -f "$d/$a-$VERSION-javadoc.jar" ] || (cd /tmp/empty-javadoc && zip -q "$OLDPWD/$d/$a-$VERSION-javadoc.jar" README)
            ls "$d"/*-sources.jar >/dev/null 2>&1 || { echo "::error::$a has no sources jar"; exit 1; }
          done
      - name: Checksums and signatures
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          cd "$REPO"
          # Local-repository metadata is not part of a Central deployment.
          find . -name 'maven-metadata*' -delete
          find . -type f ! -name '*.md5' ! -name '*.sha1' ! -name '*.sha256' ! -name '*.sha512' ! -name '*.asc' |
            while IFS= read -r f; do
              [ -f "$f.md5" ] || md5sum "$f" | cut -d' ' -f1 > "$f.md5"
              [ -f "$f.sha1" ] || sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
              gpg --batch --yes --pinentry-mode loopback --passphrase "$SIGNING_PASSWORD" --armor --detach-sign "$f"
            done
          gpg --batch --verify "$(find . -name '*.pom' | head -1).asc" "$(find . -name '*.pom' | head -1)"
      - name: Central bundles and release assets
        run: |
          mkdir -p "$OUT/bundles" "$OUT/assets"
          cd "$REPO"
          for d in io/github/ammarahm-ed/*/; do
            a=$(basename "$d")
            zip -q -r -0 "$OUT/bundles/$a-$VERSION.zip" "io/github/ammarahm-ed/$a/$VERSION"
          done
          # Hard links: the assets are the same files as the repository's, not a third copy on disk.
          find io -type f \( -name '*.aar' -o -name '*.zip' -o -name '*.tar.gz' \) -exec ln {} "$OUT/assets/" \;
          (cd "$OUT/assets" && sha256sum -- * > SHASUMS256.txt)
          {
            echo "### Artifacts"
            echo '```'
            (cd "$OUT/assets" && find . -type f -printf '%s %f\n' | sort -k2 | awk '{printf "%10.1f MB  %s\n", $1/1048576, $2}')
            echo '```'
            echo "### Central bundles"
            echo '```'
            (cd "$OUT/bundles" && find . -type f -printf '%s %f\n' | sort -k2 | awk '{printf "%10.1f MB  %s\n", $1/1048576, $2}')
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: central-bundles-${{ needs.meta.outputs.version }}-${{ github.sha }}
          path: /mnt/loom/out/bundles/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ needs.meta.outputs.version }}-${{ github.sha }}
          path: /mnt/loom/out/assets/
          retention-days: 7

  maven:
    name: Maven Central${{ inputs.dry_run && ' (validate only)' || '' }}
    needs: [meta, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: central-bundles-${{ needs.meta.outputs.version }}-${{ github.sha }}
          path: bundles
      - name: Validate every bundle, then publish them together
        # Central is immutable, so nothing is published until every bundle has validated: all bundles are
        # uploaded as USER_MANAGED deployments, and only when all are VALIDATED is each one published. A
        # bundle whose POM is already on Central (a resumed release) is skipped.
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -uo pipefail
          API=https://central.sonatype.com/api/v1/publisher
          AUTH="Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          CURL=(curl -fsS --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30)
          declare -A ids
          drop_all() { for n in "${!ids[@]}"; do "${CURL[@]}" -X DELETE -H "$AUTH" "$API/deployment/${ids[$n]}" >/dev/null || true; done; }
          # wait_for <name> <id> <wanted state> <minutes>: echoes the final state
          wait_for() {
            local deadline=$(( $(date +%s) + $4 * 60 )) state
            while :; do
              state=$("${CURL[@]}" -X POST -H "$AUTH" "$API/status?id=$2" | jq -r .deploymentState) || state=UNKNOWN
              case "$state" in
                "$3"|FAILED) echo "$state"; return ;;
              esac
              [ "$(date +%s)" -lt "$deadline" ] || { echo TIMEOUT; return; }
              sleep 20
            done
          }

          for b in bundles/*.zip; do
            name=$(basename "$b" .zip); artifact=${name%-"$VERSION"}
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://repo1.maven.org/maven2/io/github/ammarahm-ed/$artifact/$VERSION/$artifact-$VERSION.pom")
            if [ "$code" = 200 ]; then
              echo "$name: already on Maven Central, skipped"; echo "- $name: already published" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            id=$("${CURL[@]}" --max-time 3600 -X POST -H "$AUTH" -F "bundle=@$b" \
              "$API/upload?name=$name&publishingType=USER_MANAGED") || { echo "::error::$name: upload failed"; drop_all; exit 1; }
            ids[$name]=$id; echo "$name: deployment $id"
          done

          failed=0
          for name in "${!ids[@]}"; do
            state=$(wait_for "$name" "${ids[$name]}" VALIDATED 60)
            echo "- $name: $state" >> "$GITHUB_STEP_SUMMARY"
            if [ "$state" != VALIDATED ]; then
              echo "::error::$name: $state $("${CURL[@]}" -X POST -H "$AUTH" "$API/status?id=${ids[$name]}" | jq -c .errors 2>/dev/null)"
              failed=1
            fi
          done
          if [ "$failed" = 1 ] || [ "$DRY_RUN" = true ]; then
            [ "$DRY_RUN" = true ] && [ "$failed" = 0 ] && echo "Dry run: every bundle validated; dropping the deployments."
            drop_all
            exit $failed
          fi

          # Every bundle validated: publish them all.
          for name in "${!ids[@]}"; do
            "${CURL[@]}" -X POST -H "$AUTH" "$API/deployment/${ids[$name]}" >/dev/null \
              || { echo "::error::$name: publish request failed (re-run with resume: true)"; failed=1; }
          done
          for name in "${!ids[@]}"; do
            state=$(wait_for "$name" "${ids[$name]}" PUBLISHED 120)
            echo "- $name: $state" >> "$GITHUB_STEP_SUMMARY"
            [ "$state" = PUBLISHED ] || { echo "::error::$name: $state (re-run with resume: true)"; failed=1; }
          done
          exit $failed

  github-release:
    name: GitHub release${{ inputs.dry_run && ' (dry run)' || '' }}
    # Last: the tag exists only once Maven Central and npm have the version.
    needs: [meta, maven, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ needs.meta.outputs.version }}-${{ github.sha }}
          path: assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          (cd assets && sha256sum -c SHASUMS256.txt --quiet)
          flags=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Loom $VERSION" --generate-notes)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: would create v$VERSION ${flags[*]} with:"; ls -l assets
            exit 0
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION exists (resumed run); uploading any missing assets."
            gh release upload "v$VERSION" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VERSION" "${flags[@]}" assets/*
          fi

  npm:
    name: npm (staged)${{ inputs.dry_run && ' (dry run)' || '' }}
    needs: [meta, maven]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: npm with staged publishing
        run: npm install -g npm@11.21.1
      - name: Stage react-native-loom
        working-directory: packages/react-native-loom
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ needs.meta.outputs.npm_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            # The real path, without publishing: the token works, this npm has staged publishing, and the
            # package packs.
            npm whoami
            npm stage --help >/dev/null 2>&1 || { echo "::error::this npm has no 'npm stage'"; exit 1; }
            npm publish --dry-run --tag "$TAG"
          else
            npm stage publish --tag "$TAG"
            echo "Staged react-native-loom@$(node -p "require('./package.json').version") (tag $TAG). Approve it with \`npm stage approve\` or on npmjs.com." >> "$GITHUB_STEP_SUMMARY"
          fi
