name: nightly upgrade report

# Rehearses the next React Native upgrade every night and reports how many conflict
# hunks it would cost. That number - not the raw line count in `resha status` - is
# the real maintenance cost of carrying these overrides, so we want the trend
# early, while there is still time to upstream a fix or shrink a patch.
#
# Nothing is committed or pushed: the upgrade runs on a throwaway working tree and
# the result is a report (plus the conflicted files as an artifact).

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      to:
        description: react-native version to rehearse (defaults to the `next` dist-tag)
        required: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: yarn install --frozen-lockfile

      - name: Resolve the target version
        id: target
        run: |
          to="${{ inputs.to }}"
          if [ -z "$to" ]; then
            to=$(npm view react-native@next version)
          fi
          echo "to=$to" >> "$GITHUB_OUTPUT"
          echo "Rehearsing the upgrade to react-native@$to"

      - name: Rehearse the upgrade
        id: upgrade
        run: |
          set +e
          node packages/react-native-resha/bin/resha.js upgrade --to "${{ steps.target.outputs.to }}" \
            | tee upgrade-report.txt
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report
        run: |
          {
            echo "## Upgrade rehearsal: react-native@${{ steps.target.outputs.to }}"
            echo
            echo '```'
            cat upgrade-report.txt
            echo '```'
            echo
            echo 'Conflicts are listed above. Resolve them with `resha upgrade` locally;'
            echo 'see docs/upgrading.md.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the conflicted tree
        if: steps.upgrade.outputs.exit_status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-conflicts
          path: |
            packages/react-native-resha/src
            upgrade-report.txt
          if-no-files-found: ignore

      # Exit code 2 means "merged, but N hunks need a human". Fail the job so the
      # nightly run is visible rather than quietly green.
      - name: Fail when the upgrade needs work
        if: steps.upgrade.outputs.exit_status != '0'
        run: |
          echo "::error::resha upgrade to ${{ steps.target.outputs.to }} needs manual resolution (exit ${{ steps.upgrade.outputs.exit_status }})"
          exit 1