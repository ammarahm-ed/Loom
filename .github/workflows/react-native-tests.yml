name: react-native tests

# Runs Resha's Android unit tests and C++ suites inside a real
# facebook/react-native checkout at the upstream tag. That checkout is where
# `android-tests/ReactAndroid/src/test/**` can live: npm does not publish
# ReactAndroid/src/test/**, so those tests are kept for CI and are never
# materialized into node_modules/.resha.
#
# `resha overlay` writes every override - plus the android-tests and the rn-tester
# benchmark patch - into that checkout, which is also the day-to-day dev loop.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: react-native-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match overrides.json > upstream.version.
  RN_TAG: v0.87.1
  NDK_VERSION: 27.1.12297006
  CMAKE_VERSION: 3.22.1
  # The Android tests exercise the Resha code paths, so they run with the same
  # switches a device build uses. ReactAndroid reads them through findProperty().
  RESHA_SWITCHES: -PRN_UI_THREAD=true -PUI_THREAD_RENDERER=true -PUI_THREAD_RENDERER_WORKER=true

jobs:
  android-unit-tests:
    name: ReactAndroid unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Check out react-native at the upstream tag
        uses: actions/checkout@v4
        with:
          repository: facebook/react-native
          ref: v0.87.1
          path: rn
          fetch-depth: 1

      - name: Install the resha workspace
        run: yarn install --frozen-lockfile

      - name: Overlay the overrides (and the Android tests) into the checkout
        run: node packages/react-native-resha/bin/resha.js overlay --monorepo rn

      # Mirrors React Native's own contributor flow: install the monorepo's
      # dependencies, then run the ReactAndroid unit tests, which now include the
      # files from android-tests/. In the monorepo the project path is
      # :packages:react-native:ReactAndroid.
      - name: Install react-native's dependencies
        working-directory: rn
        run: yarn install

      - name: Run the unit tests
        working-directory: rn/packages/react-native/ReactAndroid
        run: |
          ./gradlew :packages:react-native:ReactAndroid:testDebugUnitTest \
            $RESHA_SWITCHES \
            --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reactandroid-unit-test-reports
          path: rn/packages/react-native/ReactAndroid/build/reports/tests
          if-no-files-found: ignore

  cpp-tests:
    name: UIThreadRenderer C++ tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Check out react-native at the upstream tag
        uses: actions/checkout@v4
        with:
          repository: facebook/react-native
          ref: v0.87.1
          path: rn
          fetch-depth: 1

      - name: Install the resha workspace
        run: yarn install --frozen-lockfile

      - name: Overlay the overrides into the checkout
        run: node packages/react-native-resha/bin/resha.js overlay --monorepo rn --no-rn-tester

      - name: Install react-native's dependencies
        working-directory: rn
        run: yarn install

      # x86_64 so the suites can run on the emulator below.
      - name: Configure and build the native libraries with the tests enabled
        working-directory: rn/packages/react-native/ReactAndroid
        run: |
          ./gradlew :packages:react-native:ReactAndroid:assembleDebug \
            -PreactNativeArchitectures=x86_64 \
            -PRN_UI_THREAD=true -PUI_THREAD_RENDERER=true -PRN_BUILD_CPP_TESTS=true \
            --console=plain

      # ui_thread_renderer_tests is EXCLUDE_FROM_ALL, so Gradle never builds it:
      # build it out of the CMake tree Gradle just generated.
      - name: Build the test executable
        working-directory: rn/packages/react-native/ReactAndroid
        run: |
          set -eu
          cxx=$(find .cxx -name build.ninja -path '*x86_64*' | head -1)
          echo "CMake build dir: $(dirname "$cxx")"
          cmake --build "$(dirname "$cxx")" --target ui_thread_renderer_tests
          echo "CMAKE_BUILD_DIR=$(dirname "$cxx")" >> "$GITHUB_ENV"

      # The suites are Android binaries, so they need a device; the emulator runs
      # the x86_64 build natively.
      - name: Run the C++ suites on an emulator
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb push "$CMAKE_BUILD_DIR/ui_thread_renderer_tests" /data/local/tmp/
            find "$ANDROID_NDK_HOME" -name 'libc++_shared.so' -path '*x86_64*' -exec adb push {} /data/local/tmp/ \;
            adb shell "cd /data/local/tmp && LD_LIBRARY_PATH=/data/local/tmp ./ui_thread_renderer_tests"

      - name: Upload the test executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-thread-renderer-tests
          path: rn/packages/react-native/ReactAndroid/.cxx/**/ui_thread_renderer_tests
          if-no-files-found: ignore