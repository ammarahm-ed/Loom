name: react-native tests

# Runs Loom's Android unit tests and C++ suites inside a real
# facebook/react-native checkout at the upstream tag. That checkout is where
# `android-tests/ReactAndroid/src/test/**` can live: npm does not publish
# ReactAndroid/src/test/**, so those tests are kept for CI and are never
# materialized into node_modules/.loom.
#
# `loom overlay` writes every override - plus the android-tests and the rn-tester
# benchmark patch - into that checkout, which is also the day-to-day dev loop.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: react-native-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match overrides.json > upstream.version.
  RN_TAG: v0.89.0-rc.0
  NDK_VERSION: 27.1.12297006
  CMAKE_VERSION: 3.22.1
  # The Android tests exercise the Loom code paths, so they run with the same
  # switches a device build uses. ReactAndroid reads them through findProperty().
  LOOM_SWITCHES: -Ploom.js=main -Ploom.renderer=loom -Ploom.worker=true

jobs:
  android-unit-tests:
    name: ReactAndroid unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Check out react-native at the upstream tag
        uses: actions/checkout@v4
        with:
          repository: facebook/react-native
          ref: v0.89.0-rc.0
          path: rn
          fetch-depth: 1

      - name: Install the loom workspace
        run: yarn install --frozen-lockfile

      - name: Overlay the overrides (and the Android tests) into the checkout
        run: node packages/react-native-loom/bin/loom.js overlay --monorepo rn

      # Mirrors React Native's own contributor flow: install the monorepo's
      # dependencies, then run the ReactAndroid unit tests, which now include the
      # files from android-tests/. In the monorepo the project path is
      # :packages:react-native:ReactAndroid.
      - name: Install react-native's dependencies
        working-directory: rn
        run: yarn install

      - name: Run the unit tests
        working-directory: rn
        run: |
          # The monorepo root build.gradle.kts turns an exported ANDROID_NDK into an
          # explicit ndkPath (ReactAndroid prefers it over the catalog version),
          # which trips AGP's CXX1100 check when the SDK's NDK is symlinked. See
          # the test app README.
          unset ANDROID_NDK || true
          ./gradlew :packages:react-native:ReactAndroid:testDebugUnitTest \
            $LOOM_SWITCHES \
            --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reactandroid-unit-test-reports
          path: rn/packages/react-native/ReactAndroid/build/reports/tests
          if-no-files-found: ignore

  cpp-tests:
    name: LoomRenderer C++ tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Check out react-native at the upstream tag
        uses: actions/checkout@v4
        with:
          repository: facebook/react-native
          ref: v0.89.0-rc.0
          path: rn
          fetch-depth: 1

      - name: Install the loom workspace
        run: yarn install --frozen-lockfile

      - name: Overlay the overrides into the checkout
        run: node packages/react-native-loom/bin/loom.js overlay --monorepo rn --no-rn-tester

      - name: Install react-native's dependencies
        working-directory: rn
        run: yarn install

      # x86_64 so the suites can run on the emulator below. The monorepo has a
      # single gradlew at its root, so the build runs from there and the project
      # path carries the prefix.
      - name: Configure and build the native libraries with the tests enabled
        working-directory: rn
        run: |
          unset ANDROID_NDK || true
          ./gradlew :packages:react-native:ReactAndroid:assembleDebug \
            -PreactNativeArchitectures=x86_64 \
            -Ploom.js=main -Ploom.renderer=loom \
            -Ploom.worker=true -Ploom.cppTests=true \
            --console=plain

      # LOOM_BUILD_CPP_TESTS=true attaches the CMake test target to the `reactnative`
      # target, so the assembleDebug above already built it. AGP stages the
      # executable and its native dependencies (libjsi, libfbjni) under
      # build/intermediates/cxx/<buildType>/<hash>/obj/<abi>/ - not next to the
      # build.ninja file in .cxx, where a search would also trip over CMake's
      # _CMakeLTOTest-* probe directories - so they are located by name.
      - name: Locate the test executable
        working-directory: rn/packages/react-native/ReactAndroid
        run: |
          set -eu
          exe=$(find build/intermediates/cxx -type f -name ui_thread_renderer_tests 2>/dev/null | head -1)
          test -n "$exe"
          # Absolute, because the steps that use these run from the repo root.
          exe="$PWD/$exe"
          echo "Test executable: $exe"
          echo "TEST_EXE=$exe" >> "$GITHUB_ENV"
          echo "TEST_LIB_DIR=$(dirname "$exe")" >> "$GITHUB_ENV"
          ls -la "$(dirname "$exe")"

      # The suites are Android binaries, so they need a device; the emulator runs
      # the x86_64 build natively.
      - name: Run the C++ suites on an emulator
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: |
            adb push "$TEST_EXE" /data/local/tmp/ui_thread_renderer_tests
            # libjsi/libfbjni are staged next to the executable;
            # libc++_shared.so comes from the NDK.
            adb push "$TEST_LIB_DIR/libjsi.so" "$TEST_LIB_DIR/libfbjni.so" /data/local/tmp/
            ndk="${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/$NDK_VERSION}"
            find "$ndk" -name 'libc++_shared.so' -path '*x86_64*' -exec adb push {} /data/local/tmp/ \;
            adb shell "cd /data/local/tmp && LD_LIBRARY_PATH=/data/local/tmp ./ui_thread_renderer_tests"

      - name: Upload the test executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-thread-renderer-tests
          path: |
            rn/packages/react-native/ReactAndroid/.cxx/**/ui_thread_renderer_tests
            rn/packages/react-native/ReactAndroid/build/intermediates/cxx/**/ui_thread_renderer_tests
          if-no-files-found: ignore