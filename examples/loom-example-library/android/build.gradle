apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def reactNativeVersion = "+"

android {
  namespace "com.loomexample"
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    minSdk rootProject.ext.minSdkVersion
    // Follow -PreactNativeArchitectures like React Native's own libraries (a source build may build one ABI only).
    ndk { abiFilters(*(project.findProperty("reactNativeArchitectures") ?: "armeabi-v7a,x86,x86_64,arm64-v8a").split(",")) }
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++20 -fexceptions -frtti -DFOLLY_NO_CONFIG=1 -DFOLLY_HAVE_CLOCK_GETTIME=1 -DFOLLY_USE_LIBCPP=1 -DFOLLY_CFG_NO_COROUTINES=1 -DFOLLY_MOBILE=1 -DFOLLY_HAVE_RECVMMSG=1 -DFOLLY_HAVE_PREADV=1 -DFOLLY_HAVE_PWRITEV=1 -DFOLLY_HAVE_UNALIGNED_ACCESS=1 -DFOLLY_HAVE_PTHREAD=1"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }
  buildFeatures { prefab true }
  externalNativeBuild { cmake { path "src/main/jni/CMakeLists.txt" } }
  packagingOptions { pickFirst "**/libc++_shared.so" }
}

dependencies {
  implementation "com.facebook.react:react-android"
}
