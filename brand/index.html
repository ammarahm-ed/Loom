<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Loom brand</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#16181D;color:#F5F7FA}
main{max-width:1200px;margin:0 auto;padding:48px 32px 80px;display:flex;flex-direction:column;gap:40px}
h1{margin:0;font-family:"Space Grotesk",sans-serif;font-size:40px;letter-spacing:-.02em}
h2{margin:0 0 16px;font-size:18px} p{margin:6px 0 0;color:#9AA3B2}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end}
.box{border-radius:20px;padding:28px;display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.dark{background:#1C1F26}.light{background:#F3F5F8;color:#23272F}
figure{margin:0;display:flex;flex-direction:column;gap:8px;align-items:center;font-size:13px;color:#9AA3B2}
.light figure{color:#5B6472} img{display:block;max-width:100%}
</style></head><body><main>
<header><h1>Loom</h1><p>react-native-loom · mark: Threads into Fabric · colours from React Native's palette.</p></header>
<section><h2>Social preview (1280×640)</h2><img src="png/loom-social-preview.png" alt="react-native-loom social preview" style="border-radius:16px;width:100%"></section>
<section><h2>Lockups</h2><div class="row">
<div class="box dark"><img src="png/loom-lockup-dark.png" alt="Loom lockup, dark" style="width:400px"></div>
<div class="box light"><img src="png/loom-lockup-light.png" alt="Loom lockup, light" style="width:400px"></div></div></section>
<section><h2>Icon</h2><div class="row">
<div class="box dark"><figure><img src="loom-icon-dark.svg" alt="Loom icon, dark" width="160"><span>icon · dark</span></figure>
<figure><img src="png/loom-avatar-400.png" alt="Loom avatar" width="96" style="border-radius:50%"><span>avatar (circle crop)</span></figure></div>
<div class="box light"><figure><img src="loom-icon-light.svg" alt="Loom icon, light" width="160"><span>icon · light</span></figure></div></div></section>
<section><h2>Small sizes (simplified mark)</h2><div class="row"><div class="box dark">
<figure><img src="png/favicon-48.png" alt="favicon 48" width="48"><span>48</span></figure>
<figure><img src="png/favicon-32.png" alt="favicon 32" width="32"><span>32</span></figure>
<figure><img src="png/favicon-16.png" alt="favicon 16" width="16"><span>16</span></figure>
<figure><img src="loom-icon-small-light.svg" alt="small mark, light" width="48"><span>light 48</span></figure>
</div></div></section>
</main></body></html>
